<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Java Calculator with History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Calculator Section -->
        <div class="calculator">
            <input type="text" id="display" readonly>
            <div class="buttons">
                <button onclick="clearDisplay()" class="btn-action">C</button>
                <button onclick="appendValue('/')" class="btn-op">/</button>
                <button onclick="appendValue('*')" class="btn-op">*</button>
                <button onclick="deleteChar()" class="btn-action">⌫</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button onclick="appendValue('-')" class="btn-op">-</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button onclick="appendValue('+')" class="btn-op">+</button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button onclick="calculate()" class="btn-equal">=</button>

                <button onclick="appendValue('0')" class="btn-zero">0</button>
                <button onclick="appendValue('.')">.</button>
            </div>
        </div>

        <!-- History Section -->
        <div class="history-panel">
            <h3>Calculation History</h3>
            <ul id="history-list">
                <!-- History items loaded dynamically -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
